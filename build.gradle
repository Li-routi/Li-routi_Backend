plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Spring Boot 메인 클래스 명시적 지정
springBoot {
	mainClass = 'com.lirouti.LiroutiApplication' // 본인의 메인 클래스명에 맞게 변경
}

repositories {
	mavenCentral()
}

dependencies {
	// jpa
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// db migration (스키마 버전 관리 + 마스터/더미 데이터 시드)
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.apache.commons:commons-pool2'
	implementation 'org.springframework.retry:spring-retry:2.0.13'

	// security & jwt
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.46.0'
	// FCM 푸시 알림 전송용 Firebase Admin SDK
	implementation 'com.google.firebase:firebase-admin:9.10.0'
	implementation 'org.springframework.boot:spring-boot-configuration-processor'

	// springdoc
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1")

	// aws s3 (presigned url)
	implementation platform('software.amazon.awssdk:bom:2.30.0')
	implementation 'software.amazon.awssdk:s3'

	// webmvc
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// local performance monitoring
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// websocket / STOMP
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// QueryDSL : OpenFeign
	implementation "io.github.openfeign.querydsl:querydsl-jpa:7.0"
	implementation "io.github.openfeign.querydsl:querydsl-core:7.0"
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:7.0:jpa"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.register('issuePerformanceToken', JavaExec) {
	group = 'performance'
	description = '활성 로컬 회원의 JMeter 개발 토큰을 users.csv에 저장합니다.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass.set('com.lirouti.support.performance.PerformanceTokenCommand')
	workingDir = layout.projectDirectory
}

tasks.named('jar') {
	enabled = false
}

tasks.named('bootJar') {
	exclude 'db/dummy/**'
}

tasks.named('test') {
	useJUnitPlatform()
	// 통합 테스트가 스프링 컨텍스트를 띄운 채 데이터를 쌓아 기본 힙(512MB)으로는 모자란다.
	// 넘치면 코드와 무관한 자리에서 컨텍스트 로딩이 실패해 원인이 안 보인다.
	maxHeapSize = "2560m"
	systemProperty 'spring.profiles.active', 'test'
	systemProperty 'JWT_SECRET', 'test-only-jwt-secret-please-do-not-use-in-production'
	systemProperty 'KAKAO_APP_ID', '1234567890'
	systemProperty 'GOOGLE_WEB_CLIENT_ID', 'test-google-web-client-id'
	systemProperty 'GOOGLE_ALLOWED_ISSUERS', 'https://accounts.google.com'
	systemProperty 'AWS_S3_BUCKET', 'lirouti-test'
	systemProperty 'ANTHROPIC_API_KEY', 'sk-ant-test-only-do-not-use'
	systemProperty 'PORTONE_API_SECRET', 'portone-test-only-do-not-use-secret'
	systemProperty 'PORTONE_STORE_ID', 'store-test-only'
	systemProperty 'PORTONE_CHANNEL_KEY', 'channel-key-test-only'
}

def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
	main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile).configureEach {
	options.generatedSourceOutputDirectory.set(querydslDir)
}

clean.doLast {
	file(querydslDir).deleteDir()
}
