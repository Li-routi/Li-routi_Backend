name: Test

# 모든 브랜치의 push마다 테스트를 돌린다. develop·main만 제외하는데, 그 둘은
# 배포 워크플로(deploy-dev.yml·deploy-prod.yml)가 이 워크플로를 workflow_call로 호출해
# 배포 전에 돌리기 때문이다 (제외하지 않으면 push마다 같은 커밋을 두 번 테스트한다).
#
# pull_request 트리거도 일부러 두지 않는다. 두면 PR이 열린 브랜치에 push할 때
# push·pull_request가 모두 발동해 같은 커밋을 두 번 테스트한다(조직 Actions 분은
# free 플랜 월 2,000분을 레포끼리 공유한다). 상태 체크는 커밋 sha 기준이라,
# push로 생성된 이 체크가 PR의 required status check를 그대로 만족시킨다.
on:
  push:
    branches-ignore: [develop, main]
  workflow_call:

jobs:
  # 워크플로 문법·표현식 검사. 무거운 test 잡과 나란히 도는 별도 잡이라 몇 초면 끝난다.
  #
  # Caddyfile 검증과 같은 이유로 넣는다. 워크플로의 표현식 오류(없는 outputs 참조, 잘못된
  # needs, 존재하지 않는 액션 입력 따위)는 GitHub 이 실행 시점에야 알려 주는데, 배포 워크플로는
  # 그 시점이 곧 배포 중이다. 번들된 shellcheck 가 run: 스크립트까지 함께 본다.
  #
  # 버전을 고정한다. latest 로 두면 규칙이 늘어난 날 아무 상관 없는 PR 이 빨간불이 된다.
  # Caddyfile 검증이 caddy:2-alpine 을 그대로 돌리는 것과 같은 방식이다.
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    # @SpringBootTest가 붙을 MySQL·Redis를 CI 안에서 컨테이너로 기동(localhost 기본값으로 접속)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: lirouti
          MYSQL_USER: lirouti
          MYSQL_PASSWORD: lirouti1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot1234"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 마이그레이션 형식 검사가 "develop 에 이미 있는 파일"을 예외로 두려면 그 ref 가 필요하다.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 빌드보다 먼저 돌린다. git이 안 잡아주는 충돌이라 여기서만 걸린다 —
      # 두 브랜치가 각각 V4__a.sql·V4__b.sql을 추가하면 파일명이 달라 자동 병합되고,
      # develop 머지 후 부팅에서 "Found more than one migration with version 4"로 죽는다.
      # Taskfile과 같은 로직이다(task db-check-duplicates). CI에는 task가 없어 그대로 옮겨 적었다.
      - name: Check migration version duplicates
        run: |
          # 마이그레이션 파일명은 V<숫자>__<설명>.sql 로 고정이라 공백·개행이 들어갈 수 없다.
          # ls 를 쓰지 말라는 지적(SC2010·SC2012)은 그런 파일명을 전제로 한 것이라 여기서는 해당이 없고,
          # Taskfile 쪽 로직과 글자 그대로 같게 두는 편이 두 곳이 갈리지 않는다.
          # shellcheck disable=SC2010,SC2012
          # 버전은 점·밑줄로 나뉠 수 있다(V2.1__, V1_1__). Taskfile의 db-check-duplicates와 같은 로직이다.
          dup=$(ls src/main/resources/db/migration/V*.sql 2>/dev/null \
            | sed 's|.*/V\([0-9][0-9._]*\)__.*|\1|' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::마이그레이션 버전이 중복됩니다: $dup — 빈 번호로 바꾸지 않으면 배포 후 부팅이 실패합니다."
            pattern=$(printf '%s' "$dup" | sed 's/\./\\./g' | paste -sd'|' -)
            # shellcheck disable=SC2010
            ls src/main/resources/db/migration/V*.sql | grep -E "/V($pattern)__"
            exit 1
          fi
          echo "✅ 마이그레이션 버전 중복 없음"

      # 중복 검사만으로는 옛 순번 방식이 다시 섞이는 것을 못 잡는다. V14__ 하나가 들어와도
      # 그 순간에는 중복이 아니므로 통과하고, 다음 사람이 같은 번호를 집을 때 비로소 걸린다.
      # 그때는 이미 develop에 들어가 있어 고치는 비용이 커진다.
      #
      # 기존 V1~V13은 이미 적용돼 이름을 바꿀 수 없으므로(체크섬) 예외로 둔다.
      # 그 위 번호를 순번으로 새로 만드는 것만 막는다.
      - name: Check migration version format
        run: |
          # develop 에 이미 있는 파일은 검사하지 않는다. 이미 적용된 마이그레이션은 이름을 바꿀 수
          # 없고(체크섬), 순번 시절 파일과 이 규칙보다 먼저 머지된 파일도 여기 포함된다.
          # 범위를 하드코딩하면(V1~V13 식) 그런 파일이 들어오는 순간 develop CI가 빨간불이 되고,
          # 고치려면 이미 적용된 파일 이름을 바꿔야 해서 더 나빠진다.
          legacy=""
          if git rev-parse --verify --quiet origin/develop >/dev/null; then
            legacy=$(git ls-tree --name-only origin/develop -- src/main/resources/db/migration/ 2>/dev/null \
              | while read -r p; do basename "$p"; done)
          else
            echo "::warning::origin/develop 을 찾지 못해 형식 검사를 건너뜁니다."
            exit 0
          fi

          bad=""
          for f in src/main/resources/db/migration/V*.sql; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            printf '%s\n' "$legacy" | grep -qxF "$name" && continue
            version=$(printf '%s' "$name" | sed 's|^V\([0-9][0-9._]*\)__.*|\1|')
            # 새 파일은 14자리 타임스탬프여야 한다(yyyyMMddHHmmss).
            case "$version" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
              *) bad="$bad $f" ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "::error::마이그레이션 버전은 타임스탬프(yyyyMMddHHmmss)로 씁니다. 순번을 쓰면 두 사람이 같은 번호를 집습니다."
            for f in $bad; do echo "  $f"; done
            echo "  task db-new -- add_something 으로 만드세요."
            exit 1
          fi
          echo "✅ 마이그레이션 버전 형식 정상"

      # Caddyfile은 서버에서만 파싱되므로, 문법이 깨져도 배포가 절반 진행된 뒤에야 드러난다.
      # 그 시점엔 앱만 뜬 채 80·443이 먹통이고 배포 자체는 성공으로 끝난다.
      #
      # 실제로 그 버그를 한 번 냈다 — LETSENCRYPT_EMAIL을 선택 설정으로 두었는데, 값이 비면
      # 인자 없는 email 지시어가 되어 Caddy가 파싱에서 죽는다. 리뷰에서 지적받아 이 명령으로
      # 재현했고, 그래서 같은 명령을 CI에 넣는다.
      #
      # 값이 비어도 통과하는 것을 막으려고 더미 값을 넣어 돌린다 — 실제 값은 배포 시점의
      # ENV_FILE에서 오고, 그쪽 비어 있음은 deploy.yml이 따로 막는다.
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e LIROUTI_DOMAIN=example.com \
            -e LETSENCRYPT_EMAIL=ci@example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      # fail-fast 필수 값(JWT_SECRET 등)은 build.gradle의 test 태스크가 더미로 주입하므로 env 불필요.
      # DB/Redis는 application.yaml 기본값(localhost:3306 / 6379)이 위 서비스 컨테이너에 붙는다.
      - name: Build & test
        run: ./gradlew build --no-daemon

      # 테스트 실패 시에만 Discord로 알림. DISCORD_WEBHOOK 시크릿이 없으면 조용히 건너뛴다.
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          # printf 의 포맷 문자열이라 작은따옴표가 맞다. %s 가 확장되면 안 된다.
          # shellcheck disable=SC2016
          curl -sf -H "Content-Type: application/json" \
            -d "$(printf '{"content":"❌ **테스트 실패** — `%s` by %s — %s"}' "$REF" "$ACTOR" "$RUN_URL")" \
            "$DISCORD_WEBHOOK" || true
