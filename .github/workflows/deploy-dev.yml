name: Deploy to development

# develop에 머지될 때 개발 서버에 배포한다. (리뷰를 거쳐 develop에 들어온 코드 = 개발 배포 대상)
#
# 이 서버가 존재하는 이유는 운영보다 먼저 깨지기 위해서다. 특히 둘이다.
#   1. Flyway 마이그레이션 — ddl-auto 가 validate 라 엔티티와 스키마가 어긋나면 부팅이 막힌다
#   2. R__ 시드 — 내용이 바뀌면 매 배포마다 다시 실행되어 마스터 데이터를 덮어쓴다
# 그래서 개발 서버도 운영과 같은 이미지·프로파일·ddl-auto 로 돌린다. 여기서 느슨하게 두면
# 먼저 깨지는 의미가 없어진다.
#
# 운영 배포(deploy-prod.yml)와 다른 점은 둘뿐이다.
#   - 시크릿이 DEV_ 접두어    이름이 갈려 있어 하나를 빠뜨려도 운영 값으로 폴백되지 않는다
#   - :latest 안 올림         그 태그는 "최신 운영본"을 가리켜야 한다
#
# 개발 서버에도 도메인을 붙였으므로 Caddy·HTTPS 절차는 운영과 같다. 서버에 올리는 compose 도
# 운영과 같은 파일(deploy/docker-compose.prod.yml)이고, 환경 차이는 전부 .env 가 흡수한다.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  # 운영과 그룹을 나눈다. 한 그룹이면 개발 배포가 도는 동안 운영 배포가 대기한다.
  group: deploy-development
  cancel-in-progress: false

jobs:
  # 1단계) 테스트 — 배포될 바로 그 커밋을 검증한다. 운영과 같은 정의를 재사용한다.
  test:
    uses: ./.github/workflows/test.yml

  # workflow_dispatch는 아무 브랜치에서나 실행할 수 있으므로 develop으로 제한한다.
  # 브랜치명은 사용자가 정하는 값이라 ${{ }}로 스크립트에 직접 펼치면 셸 주입이 된다.
  # 반드시 env로 넘겨 셸 변수로만 참조한다.
  guard:
    name: Validate deploy ref
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy ref
        env:
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          if [[ "$DEPLOY_REF" != "develop" ]]; then
            echo "::error::개발 배포는 develop에서만 실행할 수 있습니다. 현재 ref: $DEPLOY_REF"
            exit 1
          fi

  # 2단계) 이미지 빌드·push — 운영과 같은 빌드 정의를 재사용한다.
  # push_latest 를 주지 않으므로 :<커밋sha> 만 올라간다.
  build:
    needs: [test, guard]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write

  # 3단계) 배포 — 개발용 시크릿은 DEV_ 접두어로 운영과 이름을 갈라 둔다.
  # (DEV_SERVER_HOST · DEV_SERVER_SSH_KEY · DEV_ENV_FILE)
  # 이름이 다르면 하나를 빠뜨려도 운영 값으로 폴백되지 않는다 — 그냥 빈 값이 되고 아래 첫
  # 스텝이 막는다. GitHub Environments 를 쓰지 않는 이유가 이것이다: 같은 이름으로 두면
  # 환경 설정이 빠졌을 때 리포지토리 시크릿(= 운영)이 조용히 쓰인다.
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    outputs:
      ddl_auto_override: ${{ steps.ddl_auto.outputs.override }}
    steps:
      # 이 배포가 정말 개발 서버로 가는지 가장 먼저 확인한다.
      #
      # 개발용 시크릿은 DEV_ 접두어로 운영과 이름이 갈려 있어, 하나를 빠뜨려도 운영 값으로
      # 폴백되지 않는다(빈 문자열이 된다). 다만 빈 값으로 SSH 하면 에러 메시지가 불친절하고,
      # 무엇보다 DEV_SERVER_HOST 에 운영 주소를 잘못 넣는 실수는 이름만으로는 막지 못한다.
      # 그래서 운영 주소와 직접 대조한다. 두 값 모두 시크릿이라 로그에는 마스킹된다.
      - name: Verify dev target
        env:
          DEV_HOST: ${{ secrets.DEV_SERVER_HOST }}
          PROD_HOST: ${{ secrets.SERVER_HOST }}
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          if [ -z "$DEV_HOST" ]; then
            echo "::error::DEV_SERVER_HOST 시크릿이 비어 있습니다."
            exit 1
          fi
          if [ -z "$DEV_ENV_FILE" ]; then
            echo "::error::DEV_ENV_FILE 시크릿이 비어 있습니다. 개발 서버의 .env 를 만들 수 없습니다."
            exit 1
          fi
          if [ -n "$PROD_HOST" ] && [ "$DEV_HOST" = "$PROD_HOST" ]; then
            echo "::error::DEV_SERVER_HOST 가 운영 서버 주소와 같습니다. 개발 배포가 운영을 덮어쓸 뻔했으므로 중단합니다."
            exit 1
          fi
          echo "개발 서버 대상 확인 완료"

      # 개발에서도 우회는 드러낸다. 오히려 여기서 우회를 켜면 개발 서버를 둔 목적이
      # 사라지므로(마이그레이션 문제를 먼저 잡는 자리다) 알림이 더 중요하다.
      - name: Check for JPA_DDL_AUTO override
        id: ddl_auto
        env:
          ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          raw="$(printf '%s\n' "$ENV_FILE" \
            | sed -n 's/^[[:space:]]*JPA_DDL_AUTO[[:space:]]*=//p' | tail -1)"
          value="$(printf '%s' "$raw" | tr -d '\r"'"'" \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$value" ] && [ "$value" != "validate" ]; then
            echo "override=$value" >> "$GITHUB_OUTPUT"
            echo "::warning::ENV_FILE에 JPA_DDL_AUTO=${value} 가 설정되어 있습니다. 개발 서버는 마이그레이션 문제를 운영보다 먼저 잡는 자리인데, 우회를 켜면 그 검증이 꺼집니다. 마이그레이션을 고치고 이 줄을 지우세요."
          else
            echo "JPA_DDL_AUTO 우회 없음 (validate)"
          fi

      # 기본값 없이 선언된 값이라 없으면 앱이 부팅 자체를 못 한다.
      # 운영과 동일한 검사다 — AI_REVIEW_ENABLED=false 여도 키 자체는 있어야 부팅된다.
      # 값은 비밀이라 출력하지 않는다.
      - name: Check required app secrets
        env:
          ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          read_var() {
            printf '%s\n' "$ENV_FILE" \
              | sed -n "s/^[[:space:]]*$1[[:space:]]*=//p" | tail -1 \
              | tr -d '\r"'"'" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
          }
          if [ -z "$(read_var ANTHROPIC_API_KEY)" ]; then
            echo "::error::ENV_FILE에 ANTHROPIC_API_KEY가 없습니다. 앱이 부팅하지 못합니다."
            exit 1
          fi
          echo "필수 비밀값 확인 완료"

      # 운영 버킷을 가리키고 있으면 막는다. 개발 DB 는 운영 미디어를 모르므로,
      # 버킷을 공유한 채 미참조 미디어 정리가 켜지면 운영 사진 전부가 미참조로 판정된다.
      # 되돌릴 수 없는 사고라 경고가 아니라 배포 중단으로 다룬다.
      - name: Reject production bucket
        env:
          ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          bucket="$(printf '%s\n' "$ENV_FILE" \
            | sed -n 's/^[[:space:]]*AWS_S3_BUCKET[[:space:]]*=//p' | tail -1 \
            | tr -d '\r"'"'" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -z "$bucket" ]; then
            echo "::error::ENV_FILE에 AWS_S3_BUCKET이 없습니다."
            exit 1
          fi
          case "$bucket" in
            *prod*|lirouti-db-backup)
              echo "::error::개발 배포가 운영 버킷($bucket)을 가리키고 있습니다. 개발 전용 버킷으로 바꾸세요."
              exit 1
              ;;
          esac
          echo "AWS_S3_BUCKET=$bucket"

      # Caddy 는 LIROUTI_DOMAIN 없이 뜨지 못한다. 값이 비면 compose 가 빈 문자열을 넘기고
      # Caddy 는 사이트 주소가 없는 설정으로 죽는데, 그 시점에는 이미 배포가 절반 진행돼
      # 앱만 뜬 채 80·443 이 아무것도 응답하지 않는 상태가 된다. 운영과 같은 검사다.
      - name: Check Caddy env vars are set
        id: caddy_env
        env:
          ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          read_var() {
            printf '%s\n' "$ENV_FILE" \
              | sed -n "s/^[[:space:]]*$1[[:space:]]*=//p" | tail -1 \
              | tr -d '\r"'"'" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
          }
          domain="$(read_var LIROUTI_DOMAIN)"
          email="$(read_var LETSENCRYPT_EMAIL)"

          if [ -z "$domain" ]; then
            echo "::error::ENV_FILE에 LIROUTI_DOMAIN이 없습니다. Caddy가 뜨지 못해 80·443이 응답하지 않습니다."
            exit 1
          fi
          if ! printf '%s' "$domain" | grep -qE '^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+$'; then
            echo "::error::LIROUTI_DOMAIN 형식이 올바르지 않습니다: $domain"
            exit 1
          fi
          if [ -z "$email" ]; then
            echo "::error::ENV_FILE에 LETSENCRYPT_EMAIL이 없습니다. 값이 비면 Caddy가 설정 파싱에서 실패해 뜨지 않습니다(선택 설정이 아닙니다)."
            exit 1
          fi
          # 운영 도메인과 같으면 DNS 가 한쪽만 가리키므로 둘 중 하나는 인증서를 못 받는다.
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "LIROUTI_DOMAIN=$domain"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@91f3272fc5907f4699dcf59761eb622a07342f5a # v1.2.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
          # https 확인용. 시크릿이 아니라 앞 단계가 파싱해 둔 값이다.
          LIROUTI_DOMAIN: ${{ steps.caddy_env.outputs.domain }}
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          envs: IMAGE_TAG,ENV_FILE,LIROUTI_DOMAIN
          script: |
            set -e
            cd /opt/app
            if [ -z "$ENV_FILE" ]; then
              echo "::error::ENV_FILE 시크릿이 비어 있습니다. 정상 .env를 덮어쓰지 않도록 중단합니다."
              exit 1
            fi
            tmp="$(mktemp .env.XXXXXX)"
            trap 'rm -f "$tmp"' EXIT
            chmod 600 "$tmp"
            printf '%s\n' "$ENV_FILE" > "$tmp"
            printf 'APP_IMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$tmp"
            mv "$tmp" .env
            docker compose pull
            docker compose up -d
            # 앱 자체가 떴는지 본다. Caddy 를 거치지 않는 경로다.
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://localhost:8080/health; then
                echo "app is ready"; break
              fi
              if [ "$i" = "30" ]; then
                echo "app did not become ready — recent logs:"; docker compose logs --tail=50 app; exit 1
              fi
              sleep 3
            done
            # 앱이 떴다고 서비스가 뜬 것은 아니다. 위 확인은 localhost:8080 을 직접 치므로
            # Caddy 가 죽어 80·443 이 먹통이어도 통과한다. 실제로 쓰는 경로로 한 번 더 본다.
            # 실패해도 배포를 되돌리지 않는다 — 앱은 정상이고 첫 발급은 수십 초 걸릴 수 있다.
            echo "checking https://${LIROUTI_DOMAIN}/health"
            https_ok=""
            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null --max-time 5 "https://${LIROUTI_DOMAIN}/health"; then
                https_ok=1; echo "https is ready"; break
              fi
              sleep 3
            done
            if [ -z "$https_ok" ]; then
              echo "::warning::https://${LIROUTI_DOMAIN}/health 가 응답하지 않습니다. 앱은 정상이지만 Caddy 또는 인증서 발급에 문제가 있을 수 있습니다. 발급 실패가 반복되면 재배포를 멈출 것 — Let's Encrypt 인증 실패는 계정·도메인당 시간당 5회로 제한됩니다."
              docker compose logs --tail=50 caddy || true
            fi

            # 배포마다 새 :<커밋sha> 이미지가 쌓인다. 개발 서버는 볼륨이 20GB 로 운영보다
            # 작아서 이 정리가 더 중요하다.
            docker image prune -af

  notify:
    name: Notify Discord
    needs: [test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify result
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DDL_AUTO_OVERRIDE: ${{ needs.deploy.outputs.ddl_auto_override }}
          REF: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          if [ "$TEST_RESULT" != "success" ]; then
            MSG="❌ **[개발] 테스트 실패**"
          elif [ "$BUILD_RESULT" != "success" ]; then
            MSG="❌ **[개발] 빌드 실패** (테스트는 성공)"
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            MSG="❌ **[개발] 배포 실패** (빌드까지 성공)"
          else
            MSG="✅ **[개발] 배포 성공**"
          fi
          # printf 의 포맷 문자열이라 작은따옴표가 맞다. %s 가 확장되면 안 된다.
          # shellcheck disable=SC2016
          BODY="$(printf '%s — `%s` — %s' "$MSG" "$REF" "$RUN_URL")"
          if [ -n "$DDL_AUTO_OVERRIDE" ]; then
            BODY="$BODY\n⚠️ **JPA_DDL_AUTO=$DDL_AUTO_OVERRIDE 우회 중** — 개발 서버에서 우회를 켜면 마이그레이션 검증이 꺼집니다. 운영으로 넘어가기 전에 정리하세요."
          fi
          curl -sf -H "Content-Type: application/json" \
            -d "$(printf '{"content":"%s"}' "$BODY")" \
            "$DISCORD_WEBHOOK" || true
