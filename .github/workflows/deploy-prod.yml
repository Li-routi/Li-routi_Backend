name: Deploy to production

# main에 머지될 때만 운영에 배포한다.
# 테스트(test.yml)를 workflow_call로 먼저 돌려 통과한 커밋만 이미지로 만들어 배포한다.
#
# 개발 배포는 deploy-dev.yml 이 맡는다. 한 파일에 조건을 얹지 않고 나눈 이유는,
# 운영에만 필요한 절차(Caddy 확인 · https 확인)가 개발에서는 실패로 잡히기 때문이다.
# 조건문으로 섞으면 그 분기가 늘어나면서 "운영에서만 도는 경로"를 아무도 검증하지 않게 된다.
# 대신 공통인 테스트·빌드는 재사용 워크플로(test.yml · build.yml)로 한 곳에만 둔다.
#
# 이미지 태그는 커밋 sha로 고정한다. :develop 같은 이동형 태그를 서버 .env에 박으면
# "정확히 그 버전으로 되돌리는" 롤백 기준이 사라지기 때문이다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 1단계) 테스트 — 배포될 바로 그 커밋을 검증한다. 실패하면 빌드조차 시작하지 않는다.
  # test.yml을 workflow_call로 재사용하므로 테스트 정의는 한 곳에만 있다.
  # (브랜치 보호만으로는 부족하다. squash 머지는 새 sha를 만들어 PR에서 테스트한 커밋과
  #  배포되는 커밋이 달라지고, enforce_admins가 꺼져 있어 관리자는 보호를 우회해 직접 push할 수 있다.)
  #
  # secrets를 넘기지 않는 것은 의도적이다. 넘기면 test.yml 안의 Discord 알림까지 함께 발동해
  # 테스트 실패 시 알림이 두 번 간다(아래 notify 잡이 이미 "테스트 실패"를 알린다).
  test:
    uses: ./.github/workflows/test.yml

  # workflow_dispatch는 아무 브랜치에서나 실행할 수 있다. 그대로 두면 피처 브랜치가
  # 운영에 배포되고 :latest 태그도 그 빌드를 가리키게 되므로, main으로 제한한다.
  # 브랜치명은 사용자가 정하는 값이라 ${{ }}로 스크립트에 직접 펼치면 셸 주입이 된다.
  # (예: `$(...)`를 포함한 브랜치명) 반드시 env로 넘겨 셸 변수로만 참조한다.
  guard:
    name: Validate deploy ref
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy ref
        env:
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          if [[ "$DEPLOY_REF" != "main" ]]; then
            echo "::error::운영 배포는 main에서만 실행할 수 있습니다. 현재 ref: $DEPLOY_REF"
            exit 1
          fi

  # 2단계) 이미지 빌드·push — 실패하면 "빌드 실패"로 한눈에 구분된다.
  # 운영 배포이므로 :latest 를 함께 올린다.
  build:
    needs: [test, guard]
    uses: ./.github/workflows/build.yml
    with:
      push_latest: true
    permissions:
      contents: read
      packages: write

  # 3단계) 배포 — 빌드 성공 시에만 실행. 서버는 이미지를 pull 해서 재기동만 한다.
  # 운영은 기존 시크릿 이름을 그대로 쓴다(SERVER_HOST · SERVER_SSH_KEY · ENV_FILE).
  # 개발은 DEV_ 접두어라 서로 섞이지 않는다.
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    # 아래 스텝이 감지한 ddl-auto 우회 값을 notify 잡으로 넘긴다.
    # notify에는 ENV_FILE 시크릿을 주지 않으므로(알 필요가 없다) 판정 결과만 전달한다.
    outputs:
      ddl_auto_override: ${{ steps.ddl_auto.outputs.override }}
    steps:
      # Flyway 도입 이후 운영의 ddl-auto 기본값은 validate다. 부팅이 막혔을 때를 위해
      # ENV_FILE에 JPA_DDL_AUTO를 넣어 한시적으로 우회할 수 있게 열어 뒀는데, 이 우회가 조용하다.
      # 한 번 넣고 잊으면 Hibernate가 스키마를 임의로 고치는 채로 운영이 계속 돌아가고,
      # Flyway를 넣은 목적(스키마 어긋남을 부팅 때 잡는다)이 사라진다.
      #
      # 막지 않고 드러내기만 한다. 긴급 우회 경로를 없애는 쪽이 더 위험하다고 봤다.
      #
      # 값(update 등)은 비밀이 아니라 설정값이라 로그·알림에 실어도 된다. ENV_FILE 전체는 출력하지 않는다.
      - name: Check for JPA_DDL_AUTO override
        id: ddl_auto
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          raw="$(printf '%s\n' "$ENV_FILE" \
            | sed -n 's/^[[:space:]]*JPA_DDL_AUTO[[:space:]]*=//p' | tail -1)"
          # 값에 붙을 수 있는 CR·따옴표·앞뒤 공백을 벗기고 소문자로 맞춘다.
          # 소문자화는 SchemaManagementGuard와 판정을 일치시키기 위한 것이다 —
          # 한쪽만 대소문자를 구분하면 VALIDATE 같은 값에서 두 경고가 엇갈린다.
          value="$(printf '%s' "$raw" | tr -d '\r"'"'" \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$value" ] && [ "$value" != "validate" ]; then
            echo "override=$value" >> "$GITHUB_OUTPUT"
            echo "::warning::ENV_FILE에 JPA_DDL_AUTO=${value} 가 설정되어 있습니다. Hibernate가 운영 스키마를 직접 고치는 상태이며 Flyway 검증이 무력화됩니다. 마이그레이션을 고친 뒤 이 줄을 시크릿에서 지우세요."
          else
            echo "JPA_DDL_AUTO 우회 없음 (validate)"
          fi

      # 기본값 없이 선언된 값이라 없으면 앱이 부팅 자체를 못 한다.
      # 값은 비밀이라 출력하지 않는다 — 있는지만 본다.
      #
      # Caddy 확인과 별도 스텝으로 둔다. 이 검사는 개발 배포에도 똑같이 필요한데,
      # Caddy 확인 안에 섞어 두면 도메인이 없는 개발 쪽에서 함께 사라진다.
      - name: Check required app secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          read_var() {
            printf '%s\n' "$ENV_FILE" \
              | sed -n "s/^[[:space:]]*$1[[:space:]]*=//p" | tail -1 \
              | tr -d '\r"'"'" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
          }
          if [ -z "$(read_var ANTHROPIC_API_KEY)" ]; then
            echo "::error::ENV_FILE에 ANTHROPIC_API_KEY가 없습니다. 앱이 부팅하지 못합니다."
            exit 1
          fi
          echo "필수 비밀값 확인 완료"

      # Caddy 는 LIROUTI_DOMAIN 없이 뜨지 못한다. 값이 비면 compose 가 빈 문자열을 넘기고
      # Caddy 는 사이트 주소가 없는 설정으로 죽는데, 그 시점에는 이미 배포가 절반 진행돼
      # 앱만 뜬 채 80·443 이 아무것도 응답하지 않는 상태가 된다.
      #
      # ddl-auto 검사와 달리 여기서는 막는다. 그쪽은 "동작하지만 위험한" 설정이라 드러내기만
      # 하면 되지만, 이건 "배포하면 확실히 깨지는" 값이라 시작 전에 세우는 편이 낫다.
      # 값 자체(도메인)는 비밀이 아니라 로그에 실어도 된다.
      #
      # 이 스텝은 운영 전용이다. 개발 서버는 Caddy 없이 앱이 8080 을 직접 받는다.
      - name: Check Caddy env vars are set
        id: caddy_env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          read_var() {
            printf '%s\n' "$ENV_FILE" \
              | sed -n "s/^[[:space:]]*$1[[:space:]]*=//p" | tail -1 \
              | tr -d '\r"'"'" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
          }
          domain="$(read_var LIROUTI_DOMAIN)"
          email="$(read_var LETSENCRYPT_EMAIL)"

          if [ -z "$domain" ]; then
            echo "::error::ENV_FILE에 LIROUTI_DOMAIN이 없습니다. Caddy가 뜨지 못해 80·443이 응답하지 않습니다."
            exit 1
          fi
          # 도메인 형식까지 본다. 빈 값만 막으면 오타가 그대로 통과해 인증서 발급이 실패하는데,
          # 그 실패는 계정·도메인당 시간당 5회 제한을 갉아먹는다.
          if ! printf '%s' "$domain" | grep -qE '^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+$'; then
            echo "::error::LIROUTI_DOMAIN 형식이 올바르지 않습니다: $domain"
            exit 1
          fi
          # 선택 설정이 아니다. 비면 인자 없는 email 지시어가 되어 Caddy 가 설정 파싱에서 죽는다.
          if [ -z "$email" ]; then
            echo "::error::ENV_FILE에 LETSENCRYPT_EMAIL이 없습니다. 값이 비면 Caddy가 설정 파싱에서 실패해 뜨지 않습니다(선택 설정이 아닙니다)."
            exit 1
          fi
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "LIROUTI_DOMAIN=$domain"

      # ssh-action은 v1.2.3에 고정한다. v1.2.4부터 번들 drone-ssh가 1.8.2로 올라가면서
      # 입력(host/key)을 못 읽고 "no configuration file provided"로 죽는 회귀가 있어,
      # 1.8.2 직전 버전인 v1.2.3으로 내려 우회한다.
      # 서드파티 액션이라 태그가 옮겨질 수 있어 v1.2.3 커밋 SHA로 고정한다.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@91f3272fc5907f4699dcf59761eb622a07342f5a # v1.2.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          # https 확인용. 시크릿이 아니라 앞 단계가 파싱해 둔 값이다.
          LIROUTI_DOMAIN: ${{ steps.caddy_env.outputs.domain }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG,ENV_FILE,LIROUTI_DOMAIN
          script: |
            set -e
            cd /opt/app
            # 런타임 설정은 GitHub Secret(ENV_FILE)이 단일 진실 공급원이다.
            # 매 배포마다 .env를 새로 쓰므로, 서버에서 직접 고친 값은 여기서 원복된다.
            # printf '%s'는 백슬래시를 해석하지 않아 값이 그대로 보존된다(echo는 변형 위험).
            if [ -z "$ENV_FILE" ]; then
              echo "::error::ENV_FILE 시크릿이 비어 있습니다. 정상 .env를 덮어쓰지 않도록 중단합니다."
              exit 1
            fi
            # 임시 파일에 완성한 뒤 mv로 교체한다. 곧바로 .env에 리다이렉트하면
            #  (1) 기존 파일의 권한이 그대로 남고(umask는 새로 만드는 파일에만 적용된다)
            #  (2) 쓰는 도중 실패하면 정상 .env가 반쯤 덮인 채 남는다.
            tmp="$(mktemp .env.XXXXXX)"
            trap 'rm -f "$tmp"' EXIT   # 중간에 실패해도 비밀값이 든 임시 파일을 남기지 않는다
            chmod 600 "$tmp"
            printf '%s\n' "$ENV_FILE" > "$tmp"
            # 배포할 이미지는 커밋 sha로 고정한다(이동형 태그가 아니라 이 커밋 그대로).
            printf 'APP_IMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$tmp"
            mv "$tmp" .env
            docker compose pull
            docker compose up -d
            # 앱이 실제로 응답할 때까지 대기(최대 ~90s). 안 뜨면 배포 실패로 처리해 실패 알림이 나가게 한다.
            #
            # /health를 쓴다. 예전에는 /api/challenges를 봤는데, 그 경로가 인증 필요로 바뀌면서
            # 정상 기동한 앱도 403을 돌려주게 됐다. curl -f는 403을 실패로 보므로 배포가 통째로 실패한다.
            # /health는 SecurityConfig의 PUBLIC_URIS에 있어 인증 없이 200을 준다.
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://localhost:8080/health; then
                echo "app is ready"; break
              fi
              if [ "$i" = "30" ]; then
                echo "app did not become ready — recent logs:"; docker compose logs --tail=50 app; exit 1
              fi
              sleep 3
            done
            # 앱이 떴다고 서비스가 뜬 것은 아니다. 위 확인은 localhost:8080 을 직접 치므로
            # Caddy 가 죽어 80·443 이 먹통이어도 통과한다. 실제 사용자가 쓰는 경로로 한 번 더 본다.
            #
            # 실패해도 배포를 되돌리지는 않는다. 앱 자체는 정상이고, 첫 발급은 수십 초 걸릴 수
            # 있으며, 여기서 롤백하면 정상 배포까지 되돌리게 된다. 대신 조용히 지나가지 않도록
            # 경고와 Caddy 로그를 남긴다 — 인증서 문제는 사람이 봐야 풀린다.
            echo "checking https://${LIROUTI_DOMAIN}/health"
            https_ok=""
            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null --max-time 5 "https://${LIROUTI_DOMAIN}/health"; then
                https_ok=1; echo "https is ready"; break
              fi
              sleep 3
            done
            if [ -z "$https_ok" ]; then
              echo "::warning::https://${LIROUTI_DOMAIN}/health 가 응답하지 않습니다. 앱은 정상이지만 Caddy 또는 인증서 발급에 문제가 있을 수 있습니다. 아래 로그를 확인하세요. 발급 실패가 반복되면 재배포를 멈출 것 — Let's Encrypt 인증 실패는 계정·도메인당 시간당 5회로 제한됩니다."
              docker compose logs --tail=50 caddy || true
            fi

            # 배포마다 새 :<커밋sha> 이미지가 쌓이는데, prune -f는 태그가 붙은 이미지를 지우지 않아
            # 디스크(30GB)가 계속 찬다. -a로 사용 중이 아닌 이미지까지 정리한다.
            # 실행 중인 컨테이너가 쓰는 이미지(app 현재 버전·db·redis)는 대상이 아니라 안전하고,
            # 옛 버전으로 롤백할 때는 GHCR에서 다시 pull된다.
            docker image prune -af

  # 4단계) 알림 — 어느 단계에서 죽어도 결과가 나가도록 always()로 돌린다.
  notify:
    name: Notify Discord
    needs: [test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # DISCORD_WEBHOOK 시크릿이 없으면 조용히 건너뛴다.
      - name: Notify result
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DDL_AUTO_OVERRIDE: ${{ needs.deploy.outputs.ddl_auto_override }}
          REF: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          if [ "$TEST_RESULT" != "success" ]; then
            MSG="❌ **[운영] 테스트 실패**"
          elif [ "$BUILD_RESULT" != "success" ]; then
            MSG="❌ **[운영] 빌드 실패** (테스트는 성공)"
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            MSG="❌ **[운영] 배포 실패** (빌드까지 성공)"
          else
            MSG="✅ **[운영] 배포 성공**"
          fi
          # printf 의 포맷 문자열이라 작은따옴표가 맞다. %s 가 확장되면 안 된다.
          # shellcheck disable=SC2016
          BODY="$(printf '%s — `%s` — %s' "$MSG" "$REF" "$RUN_URL")"
          # ddl-auto 우회는 배포 성패와 무관하게 붙인다 — 성공 알림에만 붙이면
          # 우회가 걸린 채로 배포가 실패하는 동안 아무도 그 사실을 모르게 된다.
          if [ -n "$DDL_AUTO_OVERRIDE" ]; then
            BODY="$BODY\n⚠️ **JPA_DDL_AUTO=$DDL_AUTO_OVERRIDE 우회 중** — Hibernate가 운영 스키마를 직접 고치고 있어 Flyway 검증이 꺼진 상태입니다. 마이그레이션을 고친 뒤 \`ENV_FILE\` 시크릿에서 이 줄을 지우세요."
          fi
          curl -sf -H "Content-Type: application/json" \
            -d "$(printf '{"content":"%s"}' "$BODY")" \
            "$DISCORD_WEBHOOK" || true
