# https://taskfile.dev — 크로스플랫폼 태스크 러너
# 설치:  macOS) brew install go-task/tap/go-task
#        Windows) winget install Task.Task  또는  scoop install task
# 사용:  task            # 태스크 목록
#        task <이름>     # 실행
version: '3'

vars:
  # OS에 따라 gradle wrapper 실행 파일 선택 (mac/linux: ./gradlew, windows: gradlew.bat)
  GRADLEW: '{{if eq OS "windows"}}gradlew.bat{{else}}./gradlew{{end}}'
  # 로컬 compose 호출. 개인 포트 override(docker-compose.local.override.yml)가 있으면 자동 병합.
  DC_LOCAL:
    sh: printf 'docker compose -f docker-compose.local.yml%s' "$([ -f docker-compose.local.override.yml ] && printf ' -f docker-compose.local.override.yml')"

  # Flyway CLI를 컨테이너로 부른다(#48). Gradle 플러그인 대신 이 방식을 쓰는 이유는
  # 플러그인이 build.gradle에 접속 정보를 또 적게 만들어 application.yaml과 설정이 두 벌이 되기 때문이다.
  #
  # --network container:lirouti-mysql 은 MySQL 컨테이너의 네트워크를 그대로 공유한다.
  # compose 네트워크 이름(프로젝트 디렉터리명에서 파생)에 의존하지 않아 clone 위치가 달라도 동작한다.
  #
  # 로컬은 db/migration 과 db/dummy 를 모두 건다. migration 만 걸면 이미 적용된 더미가
  # "Missing" 으로 잡혀 멀쩡한 DB가 망가진 것처럼 보인다.
  FLYWAY: >-
    docker run --rm --network container:lirouti-mysql
    -v "$PWD/src/main/resources/db/migration:/flyway/sql:ro"
    -v "$PWD/src/main/resources/db/dummy:/flyway/dummy:ro"
    flyway/flyway:11
    -url=jdbc:mysql://localhost:3306/lirouti -user=lirouti -password=lirouti1234
    -locations=filesystem:/flyway/sql,filesystem:/flyway/dummy -connectRetries=2

tasks:
  default:
    desc: 사용 가능한 태스크 목록 출력
    cmds:
      - task --list
    silent: true

  setup:
    desc: 개발 환경 초기화 (git hook 설치 등) — clone 후 최초 1회 실행
    cmds:
      - pre-commit install
      - cmd: echo "✅ pre-commit git hook 설치 완료"
        silent: true

  build:
    desc: 전체 빌드 (컴파일 + 테스트)
    cmds:
      - '{{.GRADLEW}} build'

  compile:
    desc: 메인 소스만 빠르게 컴파일 (커밋 전 검증용)
    cmds:
      - '{{.GRADLEW}} compileJava'

  test:
    desc: 테스트 실행
    cmds:
      - '{{.GRADLEW}} test'

  run:
    desc: 애플리케이션 실행 (MySQL·Redis 필요)
    cmds:
      - '{{.GRADLEW}} bootRun'

  docker-up:
    desc: 로컬 MySQL·Redis 컨테이너 기동 (백그라운드)
    cmds:
      - '{{.DC_LOCAL}} up -d'

  docker-down:
    desc: 로컬 MySQL·Redis 컨테이너 중지 (데이터 보존)
    cmds:
      - '{{.DC_LOCAL}} down'

  docker-reset:
    desc: 로컬 컨테이너 및 볼륨(데이터)까지 완전 삭제
    cmds:
      - '{{.DC_LOCAL}} down -v'

  docker-logs:
    desc: 로컬 컨테이너 로그 실시간 확인
    cmds:
      - '{{.DC_LOCAL}} logs -f'

  db-history:
    desc: 로컬 DB에 적용된 Flyway 마이그레이션 이력 확인
    # 계정은 docker-compose.local.yml의 로컬 개발 기본값(운영 비밀값 아님).
    # 앱을 한 번도 안 띄웠으면 이력 테이블이 없다 — task run 으로 띄우면 생긴다.
    cmds:
      - '{{.DC_LOCAL}} exec -T mysql mysql -ulirouti -plirouti1234 lirouti -e "SELECT installed_rank, version, description, type, success, installed_on FROM flyway_schema_history ORDER BY installed_rank;"'

  db-info:
    desc: 로컬 Flyway 상태 확인 (적용·미적용·체크섬 불일치)
    # db-history 가 이력 테이블을 그대로 보여준다면, 이쪽은 파일과 DB를 대조한다.
    # Pending(파일은 있는데 미적용) · Missing(적용됐는데 파일이 없음) ·
    # Failed(중간에 죽음)를 구분해 주므로 부팅이 막혔을 때 원인을 여기서 먼저 본다.
    cmds:
      - '{{.FLYWAY}} info'

  db-repair:
    desc: 로컬 Flyway 이력 복구 (체크섬 재계산 · 실패 행 정리)
    # 두 경우에 쓴다.
    #   1) 이미 적용된 V__ 파일을 고쳐 "Migration checksum mismatch" 로 부팅이 막힐 때
    #   2) 마이그레이션이 중간에 죽어 success=0 행이 남아 이후 부팅이 전부 막힐 때
    #
    # repair 는 이력 테이블만 고친다 — 실제 스키마는 건드리지 않는다.
    # 즉 "파일을 고쳤으니 그 변경을 DB에 반영"해 주지 않는다. 그건 새 V__ 를 추가해야 한다.
    cmds:
      - '{{.FLYWAY}} repair'
      - cmd: echo "✅ 이력 테이블을 복구했습니다. 실제 스키마 변경은 새 V__ 마이그레이션으로 하세요."
        silent: true

  db-check-duplicates:
    desc: 마이그레이션 버전 번호 중복 검사 (CI에서도 실행)
    # git 이 안 잡아주는 충돌을 막는다. 두 브랜치가 각각 V4__a.sql · V4__b.sql 을 추가하면
    # 파일명이 달라 자동 병합이 되고, 리뷰에서도 CI 테스트에서도 걸리지 않는다.
    # 그리고 develop 머지 후 부팅에서 죽는다 — Found more than one migration with version 4.
    silent: true
    cmds:
      - |
        dup=$(ls src/main/resources/db/migration/V*.sql 2>/dev/null \
          | sed 's|.*/V\([0-9][0-9]*\)__.*|\1|' | sort -n | uniq -d)
        if [ -n "$dup" ]; then
          echo "❌ 마이그레이션 버전이 중복됩니다: $dup"
          ls src/main/resources/db/migration/V*.sql | grep -E "/V($(echo "$dup" | paste -sd'|' -))__"
          echo "   빈 번호로 하나를 바꾸세요. 이대로 머지되면 부팅이 실패합니다."
          exit 1
        fi
        echo "✅ 마이그레이션 버전 중복 없음"

  clean:
    desc: build 산출물 및 QueryDSL 생성물 삭제
    cmds:
      - '{{.GRADLEW}} clean'

  check:
    desc: 커밋/PR 전 검증 (pre-commit 전체 + 빌드)
    cmds:
      - task: precommit
      - task: build

  precommit:
    desc: pre-commit 훅을 전체 파일에 대해 수동 실행
    cmds:
      - pre-commit run --all-files

  wrapper:
    desc: gradle-wrapper.jar 이 없을 때 재생성 (시스템 gradle 필요)
    cmds:
      - gradle wrapper --gradle-version 9.5.1
