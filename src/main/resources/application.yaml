spring:
  application:
    name: lirouti

  config:
    import: optional:file:.env[.properties]
  # 로컬 개발 기본 프로파일. 배포 시 SPRING_PROFILES_ACTIVE 환경변수로 override.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # 모든 값은 ${환경변수:기본값} 으로 주입됩니다.
  # - 기본값은 "로컬 docker 개발용 임시값" 이며, 운영 환경에서는 반드시 환경변수로 override 합니다.
  # - 운영 DB 비밀번호·JWT 시크릿 등 실제 비밀값은 절대 커밋하지 말고 환경변수(또는 시크릿 매니저)로만 주입하세요.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lirouti?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:lirouti}
    password: ${DB_PASSWORD:lirouti1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway가 만든다. Hibernate는 "엔티티와 실제 스키마가 맞는지" 검사만 한다.
      # update로 두면 컬럼 추가만 조용히 반영하고 삭제·타입 변경은 무시해, 엔티티와 운영 스키마가
      # 아무 에러 없이 어긋난다. validate는 그 불일치를 부팅 시점에 실패로 드러낸다.
      # (마이그레이션 도입 중 급히 우회해야 하면 JPA_DDL_AUTO 환경변수로 덮어쓸 수 있다.)
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  # DB 스키마 버전 관리 + 마스터 데이터 시드
  # - V__ : 구조 변경. 순서대로 한 번만 실행되고 flyway_schema_history에 기록된다.
  # - R__ : 반복 실행. 파일 내용이 바뀌면 다시 돈다. 항상 V__ 가 모두 끝난 뒤에 실행된다.
  #         마스터 데이터를 여기에 두는 이유다(구조를 바꾸면 데이터도 함께 재적용된다).
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway 도입 전부터 굴러온 DB(기존 로컬·운영)에는 flyway_schema_history가 없다.
    # 그대로 두면 "빈 DB가 아닌데 이력이 없다"며 실패하므로 baseline 기록을 만들어 준다.
    baseline-on-migrate: true
    # 0으로 두는 것이 핵심이다. 기본값(1)이면 V1이 "이미 적용됨"으로 처리돼 건너뛰는데,
    # 앱을 한동안 안 띄워 스키마가 낡은 로컬 DB는 없는 테이블이 영영 안 생겨 validate에서 깨진다.
    # 0이면 기존 DB에서도 V1이 실행되고, V1은 IF NOT EXISTS라 이미 있는 테이블은 건드리지 않는다.
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# jwt 설정 관련
jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration-time: 300000 # 5분
  temp-token:
    expiration-time: 3600000
  refresh-token:
    expiration-time: 1209600000 # 14일
  dev-token:
    expiration-time: 1209600000
  issuer: lirouti

oauth:
  kakao:
    app-id: ${KAKAO_APP_ID}
  google:
    web-client-id: ${GOOGLE_WEB_CLIENT_ID}
    allowed-issuers: ${GOOGLE_ALLOWED_ISSUERS}

# 미디어 업로드(S3 presigned URL) 설정
# 자격증명은 여기에 두지 않는다. 운영은 EC2 인스턴스 프로필(IAM Role),
# 로컬은 AWS CLI 프로파일에서 SDK가 자동으로 가져간다.
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    # 업로드용 서명 URL 유효 시간. 짧을수록 안전하다.
    presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:PT5M}
    # 카테고리별 최대 업로드 용량(바이트). 사진 기본 10MB, 영상 기본 50MB.
    # 영상은 아직 켜져 있지 않지만(영상 형식 미등록), 켜질 때 바로 쓰도록 값을 둔다.
    max-image-size: ${AWS_S3_MAX_IMAGE_SIZE:10485760}
    max-video-size: ${AWS_S3_MAX_VIDEO_SIZE:52428800}
    # 저장된 미디어를 읽을 때 사용할 공개 주소. DB에는 오브젝트 key만 저장하고 읽기 URL을 이 값 + key로
    # 조립한다. 미주입 시 버킷·리전으로 S3 주소를 계산해 기본값으로 쓴다 —
    # 그래야 설정 없이도 앱이 부팅되어 배포가 깨지지 않는다(버킷이 공개면 이미지도 그대로 동작).
    # path-style(s3.리전/버킷)을 쓴다. 가상호스팅(버킷.s3.리전)은 버킷명에 '.'이 있으면
    # 와일드카드 TLS 인증서(*.s3.리전...)와 안 맞아 조회가 깨지므로, 버킷명에 무관하게 안전한 형식을 택한다.
    # CloudFront 등을 붙이면 AWS_S3_PUBLIC_BASE_URL로 이 값을 덮어써 오리진을 바꾼다.
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:https://s3.${AWS_REGION:ap-northeast-2}.amazonaws.com/${AWS_S3_BUCKET}}

---
# 로컬 개발 전용 오버라이드.
# 이 블록이 application-local.yaml이 아니라 여기 있는 이유: application-local.yaml은
# .gitignore 대상(개인 머신 오버라이드)이라 팀 공용 설정을 둘 수 없다.
spring:
  config:
    activate:
      on-profile: local

  # 운영 마스터(db/migration)에 더해 로컬 더미(db/dummy)까지 적용한다.
  # 더미는 회원·참여·인증처럼 원래 사용자가 만드는 데이터라 운영에는 들어가면 안 된다.
  flyway:
    locations: classpath:db/migration,classpath:db/dummy
