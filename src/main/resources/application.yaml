spring:
  application:
    name: lirouti

  config:
    import: optional:file:.env[.properties]
  # 로컬 개발 기본 프로파일. 배포 시 SPRING_PROFILES_ACTIVE 환경변수로 override.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      # Servlet가 Controller보다 먼저 파일을 파싱하므로 기본 1MB를 두면 10MiB 도메인 상한의 정상 요청이 막힌다.
      # 기본값은 aws.s3.max-image-size와 같은 바이트 값을 재사용한다.
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:${AWS_S3_MAX_IMAGE_SIZE:10485760}}
      # JSON metadata와 multipart boundary 여유를 포함한다. 이미지 상한을 올릴 때 이 값도 함께 올려야 한다.
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:11MB}

  # 모든 값은 ${환경변수:기본값} 으로 주입됩니다.
  # - 기본값은 "로컬 docker 개발용 임시값" 이며, 운영 환경에서는 반드시 환경변수로 override 합니다.
  # - 운영 DB 비밀번호·JWT 시크릿 등 실제 비밀값은 절대 커밋하지 말고 환경변수(또는 시크릿 매니저)로만 주입하세요.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lirouti?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:lirouti}
    password: ${DB_PASSWORD:lirouti1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        # INSERT ... ON DUPLICATE KEY UPDATE의 no-op을 0건으로 받아 실제 신규 할당 수를 계산한다.
        useAffectedRows: true

  jpa:
    hibernate:
      # 스키마는 Flyway가 만든다. Hibernate는 "엔티티와 실제 스키마가 맞는지" 검사만 한다.
      # update로 두면 컬럼 추가만 조용히 반영하고 삭제·타입 변경은 무시해, 엔티티와 운영 스키마가
      # 아무 에러 없이 어긋난다. validate는 그 불일치를 부팅 시점에 실패로 드러낸다.
      # (마이그레이션 도입 중 급히 우회해야 하면 JPA_DDL_AUTO 환경변수로 덮어쓸 수 있다.)
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  # DB 스키마 버전 관리 + 마스터 데이터 시드
  # - V__ : 구조 변경. 순서대로 한 번만 실행되고 flyway_schema_history에 기록된다.
  # - R__ : 반복 실행. 파일 내용이 바뀌면 다시 돈다. 항상 V__ 가 모두 끝난 뒤에 실행된다.
  #         마스터 데이터를 여기에 두는 이유다(구조를 바꾸면 데이터도 함께 재적용된다).
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway 도입 전부터 굴러온 DB(기존 로컬·운영)에는 flyway_schema_history가 없다.
    # 그대로 두면 "빈 DB가 아닌데 이력이 없다"며 실패하므로 baseline 기록을 만들어 준다.
    baseline-on-migrate: true
    # 0으로 두는 것이 핵심이다. 기본값(1)이면 V1이 "이미 적용됨"으로 처리돼 건너뛰는데,
    # 앱을 한동안 안 띄워 스키마가 낡은 로컬 DB는 없는 테이블이 영영 안 생겨 validate에서 깨진다.
    # 0이면 기존 DB에서도 V1이 실행되고, V1은 IF NOT EXISTS라 이미 있는 테이블은 건드리지 않는다.
    baseline-version: 0
    # 버전을 타임스탬프로 쓰기 때문에 반드시 켠다. 끄면(기본값) 부팅이 막힌다.
    #
    # 순번 방식일 때는 나중에 머지하는 쪽이 번호를 올려서 적용 순서가 늘 오름차순이었다.
    # 타임스탬프는 번호가 "만든 시각"이라 그 보장이 없다 — 먼저 만든 마이그레이션이
    # 나중에 머지되면, 이미 적용된 것보다 낮은 버전이 뒤늦게 나타난다.
    #
    #   8/06 A 생성 → 8/07 B 생성 → B 먼저 머지(적용) → 8/08 A 머지
    #   이때 A는 적용된 최대 버전보다 낮다.
    #
    # 이 값이 false면 Flyway가 A를 적용하지 않고 검증에서 실패한다. 설령 조용히
    # 건너뛰더라도 ddl-auto가 validate라 엔티티의 컬럼이 DB에 없어 어차피 부팅이 막힌다.
    #
    # 켜서 잃는 것은 "적용 순서가 곧 버전 순서"라는 성질이다. 우리 마이그레이션은
    # 테이블·컬럼 추가가 대부분이라 순서가 바뀌어도 결과가 같지만, 앞선 마이그레이션이
    # 만든 것에 의존하는 변경을 쓸 때는 그 전제가 깨질 수 있으니 주의한다.
    out-of-order: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

# jwt 설정 관련
jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration-time: 300000 # 5분
  temp-token:
    expiration-time: 3600000
  refresh-token:
    expiration-time: 1209600000 # 14일
  dev-token:
    expiration-time: 1209600000
  issuer: lirouti

oauth:
  kakao:
    app-id: ${KAKAO_APP_ID}
  google:
    web-client-id: ${GOOGLE_WEB_CLIENT_ID}
    allowed-issuers: ${GOOGLE_ALLOWED_ISSUERS}

# FCM 푸시 알림 설정.
# 비공개 키 경로는 설정 파일에 저장하지 않고 GOOGLE_APPLICATION_CREDENTIALS로 주입한다.
# 키가 없는 로컬·테스트·CI 환경이 부팅할 수 있도록 기본은 비활성화한다.
fcm:
  enabled: ${FCM_ENABLED:false}
  project-id: ${FCM_PROJECT_ID:}

# 미디어 업로드(S3 presigned URL) 설정
# 자격증명은 여기에 두지 않는다. 운영은 EC2 인스턴스 프로필(IAM Role),
# 로컬은 AWS CLI 프로파일에서 SDK가 자동으로 가져간다.
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    # 업로드용 서명 URL 유효 시간. 짧을수록 안전하다.
    presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:PT5M}
    # 비공개 미디어 조회용 서명 URL 유효 시간. 업로드용보다 길다 —
    # 업로드는 발급 직후 PUT 한 번이지만, 조회 URL은 목록 응답에 실려 화면에 머무는 동안 쓰인다.
    # 5분을 주면 잠깐 다른 앱을 보고 돌아왔을 때 사진이 전부 깨진다.
    view-url-expiration: ${AWS_S3_VIEW_URL_EXPIRATION:PT15M}
    # 카테고리별 최대 업로드 용량(바이트). 사진 기본 10MB, 영상 기본 50MB.
    # 영상은 아직 켜져 있지 않지만(영상 형식 미등록), 켜질 때 바로 쓰도록 값을 둔다.
    max-image-size: ${AWS_S3_MAX_IMAGE_SIZE:10485760}
    max-video-size: ${AWS_S3_MAX_VIDEO_SIZE:52428800}
    # 업로드된 바이트가 선언한 형식과 맞는지 실제로 읽어 확인할지(#22). 기본은 켜짐.
    # 끌 수 있게 둔 것은 탈출구다 — S3 권한·네트워크 문제로 검증이 전부 실패하면 인증 API가
    # 통째로 막히므로, 이미지 롤백보다 이 값을 false로 두고 재배포하는 편이 빠르다.
    byte-validation-enabled: ${AWS_S3_BYTE_VALIDATION_ENABLED:true}
    # 저장된 미디어를 읽을 때 사용할 공개 주소. DB에는 오브젝트 key만 저장하고 읽기 URL을 이 값 + key로
    # 조립한다. 미주입 시 버킷·리전으로 S3 주소를 계산해 기본값으로 쓴다 —
    # 그래야 설정 없이도 앱이 부팅되어 배포가 깨지지 않는다(버킷이 공개면 이미지도 그대로 동작).
    # path-style(s3.리전/버킷)을 쓴다. 가상호스팅(버킷.s3.리전)은 버킷명에 '.'이 있으면
    # 와일드카드 TLS 인증서(*.s3.리전...)와 안 맞아 조회가 깨지므로, 버킷명에 무관하게 안전한 형식을 택한다.
    # CloudFront 등을 붙이면 AWS_S3_PUBLIC_BASE_URL로 이 값을 덮어써 오리진을 바꾼다.
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:https://s3.${AWS_REGION:ap-northeast-2}.amazonaws.com/${AWS_S3_BUCKET}}

# 프록시(Caddy) 뒤에서 원래 요청의 scheme·host 를 인식하게 한다.
# 없으면 앱이 자기 주소를 http://app:8080 으로 알아, Swagger 의 "Try it out" 과
# 리다이렉트 Location 이 http 로 새어 나간다. 프록시가 없는 로컬에서는 아무 영향이 없다.
# Caddy 쪽 header_up X-Forwarded-Proto/Host 와 짝이다 — 한쪽만 있으면 소용없다.
#
# 주의: 이 전략은 X-Forwarded-* 를 보낸 주체를 따지지 않고 그대로 믿는다. 신뢰는 앞단이
# 그 헤더를 덮어쓴다는 전제에서 나오는데, Caddy 는 header_up 으로 그렇게 한다.
# 그 전제는 "앱에 직접 닿을 수 없다"에 기대므로 앱 포트를 밖으로 열면 무너진다.
# 지금은 보안그룹과 compose 의 127.0.0.1 바인딩 두 겹으로 막혀 있다.
# 8080 을 다시 공개로 여는 변경은 이 설정을 함께 검토하고 해야 한다(deploy/README.md).
server:
  forward-headers-strategy: framework

# 인증 사진 AI 심사. 사진이 그 챌린지의 의도에 맞는지 Claude 에게 묻는다.
# 재화 충전 결제(포트원 V2).
#
# PG 사(토스페이먼츠)의 키는 여기 없다 — 포트원 콘솔에만 있고, 서버는 포트원에만 말한다.
# 그래서 PG 를 바꿔도 이 설정과 코드는 그대로다.
portone:
  # 끄면 "새 결제 시작"이 막힌다. 이미 시작된 결제의 지급(완료 요청·웹훅)은 계속 돈다 —
  # 끄는 순간에도 곧 돈을 낼 사람들이 남아 있고, 그 지급까지 막으면 포트원이 재시도를
  # 포기한 뒤 돈만 빠져나간 상태로 굳는다.
  #
  # AI 심사와 달리 fail-open 이 아니다 — 검증을 건너뛰고 지급하면 재화가 공짜가 된다.
  enabled: ${PORTONE_ENABLED:true}
  # 진짜 비밀값이라 기본값을 두지 않는다. 미주입이면 형식 검증에서 부팅이 막힌다.
  api-secret: ${PORTONE_API_SECRET}
  store-id: ${PORTONE_STORE_ID}
  # 클라이언트가 결제창을 열 때 쓴다. 서버가 결제 시작 응답에 실어 내린다.
  channel-key: ${PORTONE_CHANNEL_KEY}
  base-url: ${PORTONE_BASE_URL:https://api.portone.io}

ai:
  review:
    # 끄면 자가인증으로 되돌아간다(사진만 올리면 통과). 모델이 오작동해 정상 인증을 무더기로
    # 반려할 때의 탈출구다 — 코드를 되돌리는 것보다 이 값을 끄고 재배포하는 편이 빠르다.
    enabled: ${AI_REVIEW_ENABLED:true}
    # 기본값을 두지 않는다. 미주입 시 부팅이 실패해야 키 없이 배포되는 것을 막는다.
    api-key: ${ANTHROPIC_API_KEY}
    model: ${AI_REVIEW_MODEL:claude-haiku-4-5-20251001}
    # 인증 요청 하나가 이만큼 늦어질 수 있다. 사용자가 그 시간을 그대로 기다린다.
    # 초과하면 심사를 못 한 것으로 보고 통과시킨다(fail-open) — 막히지는 않는다.
    timeout: ${AI_REVIEW_TIMEOUT:PT20S}
    # AI 에 보내기 전에 줄일 긴 변 픽셀. 이보다 큰 이미지는 심사 쪽이 어차피 축소해서 보므로
    # 원본을 그대로 보내면 판정은 같고 전송만 느려진다. 원본은 S3 에 그대로 남는다.
    max-image-dimension: ${AI_REVIEW_MAX_IMAGE_DIMENSION:1568}
    # 심사가 장애로 답을 못 주면 통과시키지 않고 보류한 뒤, 복구되면 다시 심사한다.
    pending:
      # 끄면 보류 자체를 하지 않는다 — 답을 못 주면 예전처럼 바로 통과시킨다.
      # 재심사가 오작동해 보류만 쌓일 때의 탈출구다.
      enabled: ${AI_REVIEW_PENDING_ENABLED:true}
      # 이 시간이 지나면 심사 없이 통과시킨다. 대기 prefix 수명 주기(3일)보다 반드시 짧아야
      # 한다 — 길면 재심사할 사진이 먼저 지워진다. 상한과 수명 주기 사이의 이틀이 여유다.
      max-age: ${AI_REVIEW_PENDING_MAX_AGE:PT24H}
      # 시간과 함께 두는 이유는 스케줄러가 멈춰 있던 구간을 시간이 받아 주기 때문이다.
      max-attempts: ${AI_REVIEW_PENDING_MAX_ATTEMPTS:12}
      # 장애가 길어 한꺼번에 쌓였을 때 한 실행이 과도해지지 않게 막는다.
      batch-size: ${AI_REVIEW_PENDING_BATCH_SIZE:100}

# 신고 누적 자동 숨김. 데모 전까지의 임시 조치다.
challenge:
  report:
    # 이 수만큼 신고가 쌓이면 인증을 전체 회원에게 가린다.
    # 코드가 아니라 여기 두는 이유는 적정값이 사용자 수에 따라 달라지고, 오탐이 번질 때
    # 값을 올려 그 뒤로 덜 가려지게 할 수 있기 때문이다.
    # 단, 이미 가려진 것은 이 값을 올려도 되살아나지 않는다 — 되살리려면 그 행의 hidden_at 을
    # DB 에서 직접 NULL 로 되돌려야 한다.
    hide-threshold: ${CHALLENGE_REPORT_HIDE_THRESHOLD:3}

# 미참조 미디어 정리. 업로드는 됐지만 DB 어디서도 참조하지 않는 오브젝트를 지운다.
# S3 목록과 DB를 대조하는 방식이라 s3:ListBucket·s3:DeleteObject 권한이 필요하다.
media:
  cleanup:
    # 기본 꺼짐. 운영 IAM 역할에 아직 위 두 권한이 없어(deploy/iam-policy.json 최소 권한)
    # 켜 두면 매일 AccessDenied 로그만 쌓인다. 권한을 넓힌 뒤 켜는 순서다.
    enabled: ${MEDIA_CLEANUP_ENABLED:false}
    # 실제로 지우지 않고 "지웠을 것"만 로그로 남긴다. 되돌릴 수 없는 작업이라 한 단계를 더 뒀다 —
    # 켠 뒤 며칠은 이 상태로 두고 삭제 예정 건수를 눈으로 확인한 다음 false로 바꾼다.
    # 숫자가 예상보다 크면 참조처(MediaReferenceSource)가 빠졌다는 신호다.
    dry-run: ${MEDIA_CLEANUP_DRY_RUN:true}
    # 업로드 후 이 일수가 지나야 정리 대상이 된다. presigned URL 유효 시간이 5분이라 하한은
    # 훨씬 낮지만, 업로드 후 저장 API가 실패해 앱이 나중에 재시도하는 경우를 살려두려고 넉넉히 잡았다.
    grace-days: ${MEDIA_CLEANUP_GRACE_DAYS:7}
    # 유예가 지난 날짜를 며칠 치까지 거슬러 훑을지. 하루치만 보면 배치가 한 번 걸렀을 때
    # 그 날짜는 영영 정리되지 않는다. 이미 정리된 날짜를 다시 훑는 비용은 목록 조회 한 번이라 싸다.
    catch-up-days: ${MEDIA_CLEANUP_CATCH_UP_DAYS:7}
    # 1회 실행 삭제 상한(폭주 방지). 참조처 조회가 잘못되면 모든 파일이 미참조로 보이는데,
    # 상한이 없으면 배치 한 번에 버킷이 비워진다. 정상 운영에서는 닿지 않는 값이다.
    max-deletions-per-run: ${MEDIA_CLEANUP_MAX_DELETIONS_PER_RUN:1000}

# 사용자당 요청 빈도 제한(#23). 한도를 코드가 아니라 여기 두어 재배포 없이 조정한다.
# 정책 이름은 컨트롤러의 @RateLimit 값과 맞아야 한다 — 없는 이름이면 제한이 안 걸리고 ERROR 로그만 남는다.
rate-limit:
  # 오탐으로 정상 사용자가 막히거나 Redis 문제가 생겼을 때의 탈출구.
  enabled: ${RATE_LIMIT_ENABLED:true}
  policies:
    # presigned URL 발급. 발급 한 건이 최대 10MB 업로드를 허용하므로 이 값이 곧 용량 상한이 된다
    # (30건 × 10MB = 창당 300MB, 연속으로 채우면 1.8GB/시간).
    #
    # 창을 1시간이 아니라 10분으로 둔 이유는 회복 시간이다. 고정 창이라 만료는 창의 첫 요청
    # 시각을 기준으로 걸린다. 창이 길면 한도를 소진한 사용자가 그만큼 오래 잠기는데, 실제로
    # 1시간 창에서 정상 사용자가 막혀 몇 분을 기다려도 풀리지 않는다는 제보가 있었다.
    #
    # 한 번의 인증이 발급 한 건으로 끝나지 않는 점도 값에 반영했다. presigned URL 유효 시간이
    # 5분이라 사진을 고르다 지체하거나 업로드가 끊기거나 사진을 바꾸면 재발급이 필요하고,
    # 그때마다 한 건씩 깎인다. 소진 시점이 "인증 성공"이 아니라 "발급 시도"다.
    # 챌린지·그룹 루틴·개인 루틴·프로필이 이 버킷 하나를 공유하는 것도 같은 이유로 부담이다.
    # 용도별로 나누는 작업은 따로 진행한다.
    media-presign:
      limit: ${RATE_LIMIT_MEDIA_PRESIGN_LIMIT:30}
      window: ${RATE_LIMIT_MEDIA_PRESIGN_WINDOW:PT10M}

---
# 로컬 개발 전용 오버라이드.
# 이 블록이 application-local.yaml이 아니라 여기 있는 이유: application-local.yaml은
# .gitignore 대상(개인 머신 오버라이드)이라 팀 공용 설정을 둘 수 없다.
spring:
  config:
    activate:
      on-profile: local

  # 운영 마스터(db/migration)에 더해 로컬 더미(db/dummy)까지 적용한다.
  # 더미는 회원·참여·인증처럼 원래 사용자가 만드는 데이터라 운영에는 들어가면 안 된다.
  flyway:
    locations: classpath:db/migration,classpath:db/dummy

server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: lirouti
